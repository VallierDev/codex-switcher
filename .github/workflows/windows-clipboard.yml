name: Windows clipboard
on:
  pull_request:
    paths: ['src-tauri/src/windows_clipboard.rs', 'src-tauri/src/oauth_server.rs', '.github/workflows/windows-clipboard.yml']
  push:
    branches: ['fix/windows-compat']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clipboard:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib windows_clipboard::tests
      - env:
          CODEX_SWITCHER_DISPOSABLE_TESTS: '1'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib disposable_windows_clipboard_roundtrip -- --ignored
